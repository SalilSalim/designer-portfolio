backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Info"
        file: "content/site.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role / Title", name: "role", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "text" }
          - { label: "About paragraph", name: "about", widget: "text" }
          - { label: "Profile photo", name: "portrait", widget: "image", required: false, hint: "Shown in the About section. Leave blank to keep the plain frame." }
          - { label: "Location / city", name: "location", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "string", required: false, hint: "As much or as little as you want shown — city only is fine." }
          - { label: "Resume / CV file", name: "resume", widget: "file", required: false, hint: "Upload a PDF — a \"Download CV\" link appears automatically when this is set." }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Behance URL", name: "behance", widget: "string", required: false }
          - { label: "Availability note", name: "availability", widget: "string" }

  - name: "work"
    label: "Work"
    files:
      - name: "items"
        label: "Work Items"
        file: "content/work.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "string"
                hint: "Type any category you like — e.g. Branding, Illustration, Packaging, Web Design. It gets its own filter tab on the site automatically, no code changes needed."
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Medium / Tools", name: "medium", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Project link (optional)", name: "link", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image" }
